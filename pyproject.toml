[project]
name = "momentum-risk-project"
version = "0.1.0"
description = "Reproducible momentum risk-management replication and stock-level cost study"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arch>=8.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas==3.0.6",
    "pandas-datareader>=0.11.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.0",
    "wrds>=3.1.6",
]

[project.scripts]
momentum-risk-project = "momentum_risk_project.pipeline:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[dependency-groups]
dev = [{include-group = "test"}]
test = ["pytest>=9.1.1", "ipykernel>=7.4.0", "jupyter>=1.1.1", "ruff>=0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
