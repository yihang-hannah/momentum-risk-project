[project]
name = "momentum-risk-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arch>=8.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas==3.0.6",
    "pandas-datareader>=0.11.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.0",
    "wrds>=3.1.6",
]

[project.scripts]
momentum-risk-project = "momentum_risk_project:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
